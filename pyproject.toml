[project]
name = "citibike-pipeline"
version = "0.1.0"
description = "Streaming Citibike aggregation: Redpanda to PyFlink to Redis to HTTP"
# Upper bound is PyFlink's, not ours: apache-flink 1.20 ships no wheels for 3.12+.
requires-python = ">=3.10,<3.12"
dependencies = []

[dependency-groups]
flink = [
    # Must match the Flink version in the base image (flink:1.20-... is 1.20.5),
    # so the Python client and the cluster speak the same protocol.
    "apache-flink==1.20.5",
    "redis==5.0.8",
]
api = [
    "fastapi==0.115.0",
    # Declared explicitly rather than leaned on as a FastAPI transitive: the
    # response models import it directly, so it is a first-order dependency.
    "pydantic==2.9.2",
    "uvicorn[standard]==0.30.6",
    "redis==5.0.8",
]
# Mirrors the provided generator_requirements.txt so the generator runs from
# the same lockfile as everything else.
generator = [
    "kafka-python>=2.0.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    # Endpoint tests run against a fake Redis and FastAPI's TestClient, so the
    # whole suite needs no running infrastructure.
    "fakeredis>=2.25",
    "httpx>=0.27",
]

[tool.uv]
# An application repo, not a distributable library: nothing to build or install.
package = false
default-groups = ["dev"]
# apache-beam (pulled in by apache-flink) has a setup.py that imports
# pkg_resources, which setuptools 81 removed. Only affects source builds.
build-constraint-dependencies = ["setuptools<81"]

[tool.pytest.ini_options]
# Tests live beside the component they cover rather than in a top-level tests/
# directory, so each deployable carries its own suite.
testpaths = ["flink_job/tests", "api/tests"]

[tool.ruff]
line-length = 100
# Provided by the challenge and explicitly not to be modified.
extend-exclude = ["event_generator.py"]
